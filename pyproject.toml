[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-showcase"
version = "0.1.0"
description = "A tiny agentic paper-trading bot — observe, think, act, over a simulated market."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rea Fun" }]
keywords = ["agent", "trading", "backtest", "showcase", "paper-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rea-fun/agentic-showcase"

[project.scripts]
agentic-showcase = "agentic_showcase.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_showcase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
